# CORS Filter Configuration Localization (English)
# Object Class Definition
%ocd.corsFilter.name=CORS Filter Configuration
%ocd.corsFilter.description=Configuration for Cross-Origin Resource Sharing (CORS) servlet filter

# Allowed Origins
%allowedOrigins.name=Allowed Origins
%allowedOrigins.description=List of origins allowed to make CORS requests. Use "*" to allow all origins, or specify exact origins like "https://example.com". Supports wildcard patterns like "https://*.example.com".

# Allowed Timing Origins
%allowedTimingOrigins.name=Allowed Timing Origins
%allowedTimingOrigins.description=List of origins allowed to access timing information via the Timing-Allow-Origin header. This controls which origins can read performance timing data from cross-origin resources.

# Allowed Methods
%allowedMethods.name=Allowed HTTP Methods
%allowedMethods.description=List of HTTP methods allowed for CORS requests. Common methods include GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH.

# Allowed Headers
%allowedHeaders.name=Allowed Request Headers
%allowedHeaders.description=List of request headers allowed in CORS requests. Use "*" to allow all headers, or specify individual headers like "Content-Type", "Authorization", "X-Requested-With".

# Preflight Max Age
%preflightMaxAge.name=Preflight Cache Duration
%preflightMaxAge.description=Maximum time in seconds that preflight responses can be cached by the browser. This reduces the number of preflight requests for repeated CORS calls. Default is 1800 seconds (30 minutes).

# Allow Credentials
%allowCredentials.name=Allow Credentials
%allowCredentials.description=Whether to allow credentials (cookies, authorization headers, TLS client certificates) in CORS requests. When enabled, browsers will include credentials in cross-origin requests.

# Exposed Headers
%exposedHeaders.name=Exposed Response Headers
%exposedHeaders.description=List of response headers that the browser is allowed to access from JavaScript in CORS requests. By default, only simple headers are exposed. Add custom headers that should be accessible to client-side scripts.

# Chain Preflight
%chainPreflight.name=Chain Preflight Requests
%chainPreflight.description=Whether to forward preflight OPTIONS requests to the application after processing CORS headers. When enabled, the application can also handle the preflight request. When disabled, the filter handles preflight requests entirely.
