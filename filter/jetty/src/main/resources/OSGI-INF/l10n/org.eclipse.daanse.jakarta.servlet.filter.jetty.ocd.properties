# Jakarta Servlet Filter Jetty CORS Configuration Localization

# OCD Names and Descriptions
ocd.corsFilter.name=CORS Filter
ocd.corsFilter.description=Configuration for Cross-Origin Resource Sharing (CORS) Filter

# Property Names and Descriptions (using CrossOriginFilter parameter names)
allowedOrigins.name=Allowed Origins
allowedOrigins.description=A comma separated list of origins that are allowed to access the resource. Default value is *, meaning all origins

allowedTimingOrigins.name=Allowed Timing Origins
allowedTimingOrigins.description=A comma separated list of origins that are allowed to time the resource via the Timing-Allow-Origin header

allowedMethods.name=Allowed Methods
allowedMethods.description=A comma separated list of HTTP methods that are allowed to be used when accessing the resource

allowedHeaders.name=Allowed Headers
allowedHeaders.description=A comma separated list of HTTP headers that are allowed to be specified when accessing the resource

preflightMaxAge.name=Preflight Max Age
preflightMaxAge.description=The number of seconds that preflight requests can be cached by the client

allowCredentials.name=Allow Credentials
allowCredentials.description=A boolean indicating if the resource allows requests with credentials

exposedHeaders.name=Exposed Headers
exposedHeaders.description=A comma separated list of HTTP headers that are allowed to be exposed on the client

chainPreflight.name=Chain Preflight
chainPreflight.description=If true preflight requests are chained to their target resource for normal handling (as an OPTION request). Otherwise the filter will response to the preflight
